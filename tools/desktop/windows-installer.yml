name: Windows installer

on:
  pull_request:
    paths:
      - 'tools/desktop/**'
      - '.github/workflows/windows-installer.yml'
      - 'packages/server/src/web-static*'
      - 'packages/server/src/index.ts'
      - 'package*.json'
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Desktop version (major.minor.patch)
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    env:
      DESKTOP_INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Select version
        run: |
          $version = $env:DESKTOP_INPUT_VERSION
          if (!$version) { $version = '0.1.0' }
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME -replace '^desktop-v', '' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid desktop version.' }
          "DESKTOP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: node tools/metrics.mjs --tests --check
      - name: Build installer
        run: npm run desktop:build -- -Version $env:DESKTOP_VERSION -SkipBuild
      - name: Verify installation lifecycle
        run: npm run desktop:smoke -- -Version $env:DESKTOP_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: StudentBuddy-windows-x64
          path: |
            .runtime/desktop-output/*.exe
            .runtime/desktop-output/SHA256SUMS.txt
      - name: Publish desktop release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME ".runtime/desktop-output/StudentBuddy-$env:DESKTOP_VERSION-windows-x64-setup.exe" .runtime/desktop-output/SHA256SUMS.txt --verify-tag --latest=false --title "StudentBuddy Windows $env:DESKTOP_VERSION" --notes-file tools/desktop/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
