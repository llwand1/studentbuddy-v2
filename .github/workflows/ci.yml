# CI —— 每次推送/PR 跑全量质量门禁（tsc×3 + eslint + vitest + gates）。
# 与本地 `npm run check` 完全同一套判据：本地绿的，CI 必绿；CI 红的，不许合。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 与 package.json engines（Node ≥22.11）对齐：Node 20 的内置 undici 缺新 API，
        # 依赖链在它上面必炸（webidl.util.markAsUncloneable is not a function）
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
