<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- 门面页的搜索呈现（词条长尾页的机制与红线见 docs/SEO-SPEC.md） -->
  <meta name="description" content="StudentBuddy：把学过的东西抽成词条，词条自己长出复习、出题、概念图与总结。数据存在自己手里——本地安装包或自己的服务器都能跑。" />
  <meta property="og:title" content="StudentBuddy - 以词条为中心的学习助手" />
  <meta property="og:description" content="学过的东西抽成词条，词条自己长出复习、出题、概念图与总结。数据自持。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://11wand.com/" />
  <meta property="og:site_name" content="StudentBuddy" />
  <!-- 分享卡 1200×630：PNG 是静态资源（`public/og/home.png`，重新生成 `npm run og:shots`），
       这里那串地址与 `src/seo/og-card.ts` 的 HOME_OG_CARD 由 `og-card.test.ts` 锁成同一个值 -->
  <meta property="og:image" content="https://11wand.com/og/home.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="StudentBuddy：以词条为中心的学习助手，学练析忆反馈一条闭环" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- 抓取入口之一（HTML 规范的 sitemap link 扩展）：与 `robots.txt` 里那行 `Sitemap:` 同指一处 -->
  <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
  <title>StudentBuddy - 以词条为中心的学习助手</title>
</head>
<body>
  <!-- ★ 静态可抓入口：SPA 首页在不执行 JS 的抓取器眼里原本零 `<a>`。为什么用 `hidden`、
       它的锁与线上判据，一律见 `docs/SEO-SPEC.md` §5 第 11 条（这份文件随站发布，不装施工理由） -->
  <nav hidden>
    <a href="/terms/index.html">学习词条目录</a>
  </nav>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <!-- 访问统计（自托管 GoatCounter，无 cookie 无个人信息——与「数据自持」产品叙事一致） -->
  <script data-goatcounter="https://11wand.com/stats/count" async src="//11wand.com/stats/count.js"></script>
</body>
</html>
