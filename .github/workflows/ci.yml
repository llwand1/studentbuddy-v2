# CI —— 每次推送/PR 跑全量质量门禁（**build** ＋ tsc×3 ＋ eslint ＋ vitest ＋ gates）。
# 判断标准与本地 `npm run check` 同源，★ 但**比它多一步 `npm run build`**：09-24 实测过一起
# 「`npm run check` 四连全绿而 `npm run build` EXIT=1」——`vite.config.ts` 在纯 Node 里加载 `src/seo/`，
# 那里 `@sb/shared` 根入口的 NodeNext 写法解析不动。⇒ check 绿不代表发得出去，build 必须有人查。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 与 package.json engines（Node ≥22.11）对齐：Node 20 的内置 undici 缺新 API，
        # 依赖链在它上面必炸（webidl.util.markAsUncloneable is not a function）
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
        with:
          # ★ 2026-09-30 加：`tools/check-version.mjs`（gates 的一环）要拿「最高已合并 tag」与 package.json 对账，
          #   浅克隆没有 tag 就只能跳过这一条 ⇒ 拉全历史（仓库很小，代价可忽略）
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # ★ 构建也在 CI 里跑：`npm run check` 不含它，而「构建产物出不来」＝这一版根本发不出去
      # ★ 2026-09-25 起它排在 check **前面**（issue #8）：公开字节卫生扫描要读 `dist` 里的
      #   JS／CSS 产物，放在 check 之后就永远是「没有产物」⇒ 那几例显式跳过、锁形同虚设。
      - run: npm run build
      - run: npm run check
      # README/docs 里的定量数字必须与代码实测一致（漂移即红）——数字不许手抄，见 docs/metrics.md
      - run: node tools/metrics.mjs --tests --check
      # ★ 2026-09-27 加：守门判别力审计（docs/ENGINEERING.md §2 的第 ④ 条复验命令）。
      #   加它的直接理由是一起**实测事故**：首屏对外数字的守门**静默停摆过两轮**——它按
      #   `Landing.tsx` 里的 `<span>…</span>` 取字，而首屏文案先挪进 `app/landing-copy.ts` 的
      #   `STATS`（`<span key=…>` 带属性 ⇒ 正则 0 条），后又整表换成 `HERO_TAGS` ⇒ 两轮都是
      #   **claims 恒为空 ⇒ 恒打「✓ 首屏可核对数字与实测一致」**。第一轮停摆期间，首屏对每位
      #   访客挂着 `150 个 REST 接口`（实测 135）与 `2600+ 自动化测试`（实测 2997，已越档）。
      #   `guard-audit` 当时就能指出来（首屏 4 条 label 全「已静默消失」），但它只在人想起来时
      #   手动跑 —— **一条没人跑的复验命令，和不存在没有区别**。⇒ 交给 CI。
      #   ★ 必须排在上一步**之后**：本脚本要读 `test-results/metrics-vitest.json`（`--tests` 的产物），
      #     缺了它，依赖实测例数的那几条 claim 不入列，审计会把"产物没生成"误报成"守门消失"。
      - run: node tools/guard-audit.mjs
