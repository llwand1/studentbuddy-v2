name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: lint（tsc + eslint）
        run: npm run lint
      - name: test（vitest）
        run: npm run test
      - name: gates（行数/内联样式/any）
        run: npm run gates
      - name: build
        run: npm run build
